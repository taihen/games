<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Flap</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🐤</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen touch-none select-none bg-slate-950 text-slate-100 antialiased">
    <div class="mx-auto flex max-w-md flex-col items-center px-4 py-8">
      <div class="flex w-full items-center justify-between">
        <a href="../" class="text-sm text-slate-400 underline hover:text-slate-200">← All games</a>
        <div class="text-lg font-semibold">
          Score: <span id="score">0</span>
          <span class="ml-3 text-slate-400">Best: <span id="best">0</span></span>
        </div>
      </div>

      <h1 class="mt-6 text-3xl font-bold">🐤 Flap</h1>

      <canvas
        id="board"
        class="mt-6 rounded-xl border border-slate-800"
      ></canvas>

      <p class="mt-4 text-center text-sm text-slate-400">
        <span class="text-slate-200">Space</span> / click / tap to flap. Dodge the pipes.
      </p>
    </div>

    <script src="flappy.js"></script>
  </body>
</html>
