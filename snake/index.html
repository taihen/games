<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <div class="mx-auto flex max-w-2xl flex-col items-center px-6 py-8">
      <div class="flex w-full items-center justify-between">
        <a href="../" class="text-sm text-slate-400 underline hover:text-slate-200">← All games</a>
        <div class="text-lg font-semibold">
          Score: <span id="score">0</span>
          <span class="ml-3 text-slate-400">Best: <span id="best">0</span></span>
        </div>
      </div>

      <h1 class="mt-6 text-3xl font-bold">🐍 Snake</h1>

      <canvas
        id="board"
        class="mt-6 rounded-xl border border-slate-800 bg-slate-900"
      ></canvas>

      <p class="mt-4 text-center text-sm text-slate-400">
        Arrow keys or WASD to move. <span class="text-slate-200">Space</span> / tap to start or restart.
      </p>

      <div
        id="overlay"
        class="mt-4 hidden rounded-lg bg-slate-800 px-4 py-2 text-center text-slate-100"
      ></div>
    </div>

    <script src="snake.js"></script>
  </body>
</html>
