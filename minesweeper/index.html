<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Minesweeper</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>💣</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .cell {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        user-select: none;
        cursor: pointer;
        line-height: 1;
      }
      .n1 { color: #60a5fa; }
      .n2 { color: #4ade80; }
      .n3 { color: #f87171; }
      .n4 { color: #c084fc; }
      .n5 { color: #fb923c; }
      .n6 { color: #2dd4bf; }
      .n7 { color: #e879f9; }
      .n8 { color: #cbd5e1; }
    </style>
  </head>
  <body class="min-h-screen touch-none select-none bg-slate-950 text-slate-100 antialiased">
    <div class="mx-auto flex max-w-2xl flex-col items-center px-4 py-8">
      <div class="flex w-full items-center justify-between">
        <a href="../" class="text-sm text-slate-400 underline hover:text-slate-200">← All games</a>
        <select
          id="difficulty"
          class="rounded-lg bg-slate-800 px-3 py-1 text-sm font-semibold"
        >
          <option value="easy">Easy · 9×9 · 10</option>
          <option value="medium" selected>Medium · 16×16 · 40</option>
          <option value="hard">Hard · 16×30 · 99</option>
        </select>
      </div>

      <h1 class="mt-6 text-3xl font-bold">💣 Minesweeper</h1>

      <div class="mt-5 flex items-center gap-4">
        <div class="rounded-lg bg-slate-800 px-3 py-1 text-center">
          <div class="text-xs text-slate-400">MINES</div>
          <div id="mines" class="text-lg font-bold">0</div>
        </div>
        <button
          id="reset"
          class="rounded-lg bg-slate-800 px-4 py-2 text-2xl hover:bg-slate-700"
          title="New game"
        >
          🙂
        </button>
        <div class="rounded-lg bg-slate-800 px-3 py-1 text-center">
          <div class="text-xs text-slate-400">TIME</div>
          <div id="time" class="text-lg font-bold">0</div>
        </div>
      </div>

      <div id="board" class="mt-6 inline-grid gap-px rounded-lg bg-slate-700 p-px"></div>

      <p class="mt-4 text-center text-sm text-slate-400">
        Click reveal · right-click (or long-press) to flag. First click is always safe.
      </p>
    </div>

    <script src="game.js"></script>
  </body>
</html>
