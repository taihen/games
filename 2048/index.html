<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>2048</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🔢</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .tile {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.5rem;
        font-weight: 700;
        transition: transform 80ms ease;
      }
      .tile.pop {
        animation: pop 120ms ease;
      }
      @keyframes pop {
        0% { transform: scale(0.6); }
        60% { transform: scale(1.08); }
        100% { transform: scale(1); }
      }
    </style>
  </head>
  <body class="min-h-screen touch-none select-none bg-slate-950 text-slate-100 antialiased">
    <div class="mx-auto flex max-w-md flex-col items-center px-6 py-8">
      <div class="flex w-full items-center justify-between">
        <a href="../" class="text-sm text-slate-400 underline hover:text-slate-200">← All games</a>
        <div class="flex gap-3 text-center">
          <div class="rounded-lg bg-slate-800 px-3 py-1">
            <div class="text-xs text-slate-400">SCORE</div>
            <div id="score" class="text-lg font-bold">0</div>
          </div>
          <div class="rounded-lg bg-slate-800 px-3 py-1">
            <div class="text-xs text-slate-400">BEST</div>
            <div id="best" class="text-lg font-bold">0</div>
          </div>
        </div>
      </div>

      <h1 class="mt-6 text-3xl font-bold">🔢 2048</h1>

      <div id="board" class="relative mt-6 rounded-xl bg-slate-800 p-3"></div>

      <button
        id="new"
        class="mt-5 rounded-lg bg-emerald-600 px-4 py-2 font-semibold hover:bg-emerald-500"
      >
        New game
      </button>

      <p class="mt-4 text-center text-sm text-slate-400">
        Arrow keys / WASD or swipe. Merge equal tiles to reach
        <span class="text-slate-200">2048</span>.
      </p>

      <div
        id="overlay"
        class="mt-4 hidden rounded-lg bg-slate-800 px-4 py-2 text-center text-slate-100"
      ></div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
